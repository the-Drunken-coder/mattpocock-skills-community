name: Sync upstream skills

on:
  schedule:
    - cron: "5 0 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the package
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchronize promoted skills
        run: python3 scripts/sync_upstream.py --ref main

      - name: Check generated files
        run: |
          python3 -m py_compile scripts/sync_upstream.py
          git diff --check

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "Upstream is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex-plugin/plugin.json plugin.json LICENSE THIRD_PARTY_NOTICES.md skills scripts
          git commit -m "chore: sync Matt Pocock skills"
          git push
