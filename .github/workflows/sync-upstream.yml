name: Sync upstream skills

on:
  schedule:
    # GitHub cannot subscribe to pushes in another repository, so poll Matt's
    # main branch. The sync and commit steps are no-ops when nothing changed.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the package
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Synchronize skills and validate adaptations
        run: python3 scripts/sync_upstream.py --ref main --report .sync-report.json

      - name: Check generated files
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -q
          python3 scripts/sync_upstream.py --check
          git diff --check

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Upstream is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/plugins/marketplace.json .codex-plugin/plugin.json plugin.json LICENSE THIRD_PARTY_NOTICES.md skills scripts
          git commit -m "chore: sync Matt Pocock skills"
          git push

      - name: Keep sync report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-report
          path: .sync-report.json
          include-hidden-files: true
          retention-days: 14

      - name: Report publication result
        if: always()
        env:
          SYNC_STATUS: ${{ job.status }}
        run: |
          printf '\nPublication result: **%s**\n' "$SYNC_STATUS" >> "$GITHUB_STEP_SUMMARY"
